name: Build HTTP Image

on:
  workflow_dispatch:

jobs:
  build-http:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push HTTP Image
        run: |
          docker build -f Dockerfile.http -t hrm3478938/pcbgenius-http:latest .
          docker push hrm3478938/pcbgenius-http:latest
