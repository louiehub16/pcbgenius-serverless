# Build the PCBGenius physics-solver image (openEMS/Elmer/CalculiX, CPU) and push to Docker Hub.
# Trigger: manual (workflow_dispatch) or push touching physics-solver/.
# Secrets you must configure in the repo settings:
#   DOCKERHUB_USERNAME = hrm3478938
#   DOCKERHUB_TOKEN    = the dckr_pat_... access token (Read/Write/Delete)
name: Physics Solver Build & Push to Docker Hub

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'physics-solver/**'

env:
  IMAGE_NAME: hrm3478938/pcbgenius-physics-solver

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Free up disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./physics-solver
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify image
        run: |
          echo "Pushed: ${{ env.IMAGE_NAME }}:latest"
          docker run --rm ${{ env.IMAGE_NAME }}:latest python3 -c 'import sys; sys.stdout.write("entrypoint-probe\n")' || true