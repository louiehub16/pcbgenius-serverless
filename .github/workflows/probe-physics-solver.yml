# Probe the pushed pcbgenius-physics-solver image: run the REAL entrypoint + ldd
# each solver, and for ElmerSolver print the FULL missing-lib chain + loader path
# so runtime library gaps are diagnosed precisely (not guessed).
name: Probe Physics Solver Image

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Pull image
        run: docker pull hrm3478938/pcbgenius-physics-solver:latest

      - name: Run entrypoint (presence probe)
        run: docker run --rm hrm3478938/pcbgenius-physics-solver:latest

      - name: which + ldd (full missing-lib diagnosis)
        run: |
          docker run --rm --entrypoint sh hrm3478938/pcbgenius-physics-solver:latest -c '
            echo "=== presence ==="
            for b in openEMS gmsh ElmerSolver ccx; do printf "%s: " "$b"; command -v "$b" || echo MISSING; done
            echo "=== ldd ElmerSolver (FULL missing chain) ==="
            ldd /usr/local/bin/ElmerSolver 2>&1 | grep -E "not found|=>" | head -40
            echo "=== loader path ==="
            echo "LD_LIBRARY_PATH=$LD_LIBRARY_PATH"
            echo "=== what MUMPS/scalapack/scotch libs are actually present ==="
            ls -1 /usr/lib/x86_64-linux-gnu/ | grep -iE "mumps|scalapack|scotch|parmetis|openblas" | head -40
            echo "=== where does apt think libmumps-ptscotch-5.4 installs .so? ==="
            dpkg -L libmumps-ptscotch-5.4 2>/dev/null | grep -E "\.so" | head
            '