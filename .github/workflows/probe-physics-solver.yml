# Probe the pushed pcbgenius-physics-solver image: verify solvers present, and
# CRITICALLY confirm the /work/benchmarks/ case files are baked into the image
# (so a benchmark-less image can never be taken for a benchmark-capable one).
# This runs BEFORE the Salad CPU test.
name: Probe Physics Solver Image (checks benchmarks present)

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Pull image
        run: docker pull hrm3478938/pcbgenius-physics-solver:latest

      - name: Run entrypoint (full verification + push results to R2)
        run: |
          echo "=== entrypoint (presence + verification benchmark) ==="
          docker run --rm \
            -e R2_ENDPOINT_URL="${{ secrets.R2_ENDPOINT_URL }}" \
            -e BUCKET_NAME="${{ secrets.R2_BUCKET }}" \
            -e AWS_ACCESS_KEY_ID="${{ secrets.R2_ACCESS_KEY }}" \
            -e AWS_SECRET_ACCESS_KEY="${{ secrets.R2_SECRET_KEY }}" \
            -e OPENEMS_RUN_FULL=1 \
            hrm3478938/pcbgenius-physics-solver:latest \
            || echo "(entrypoint exited non-zero; reads verification output)"

      - name: Verify /work/benchmarks are present in the image
        run: |
          docker run --rm --entrypoint sh hrm3478938/pcbgenius-physics-solver:latest -c '
            echo "=== benchmarks tree ==="
            find /work/benchmarks -type f 2>/dev/null | sort
            echo "=== expect 9 files: calculix/vm_bar_tension.inp, gmsh/unit_cube.geo, openems/microstrip_5p8.py, README.md, elmer/ssheat/* x5 ==="
            echo "count: $(find /work/benchmarks -type f 2>/dev/null | wc -l)"
            echo "=== solver binaries ==="
            for b in openEMS gmsh ElmerSolver ccx; do printf "%s: " "$b"; command -v "$b" || echo MISSING; done
            echo "=== entrypoint has run_verifications? ==="
            grep -q "run_verifications" /work/solver_entrypoint.py && echo "YES run_verifications present" || echo "NO run_verifications"
            grep -q "def _verify_gmsh" /work/solver_entrypoint.py && echo "YES _verify_gmsh" || echo "NO _verify_gmsh"
            echo "=== stale .f01 ref should be gone ==="
            grep -q "vm_bar_tension.f01" /work/solver_entrypoint.py && echo "STALE .f01 STILL PRESENT (bad)" || echo "OK no .f01 ref"
            '