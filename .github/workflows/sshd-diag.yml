name: SSHd Diagnosis (reproduce training sshd failure)
on:
  workflow_dispatch:

env:
  IMAGE: hrm3478938/pcbgenius-training:latest

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce sshd startup exactly as entrypoint does (NO `|| true` swallow)
        run: |
          set -x
          # Simulate the container: build from the same Dockerfile, then run the
          # SAME commands ssh_entrypoint.sh runs for SSH -- but WITHOUT the error swallow.
          docker pull $IMAGE
          # We need a host key + authorized key to mimic the entrypoint env
          ssh-keygen -q -t ed25519 -N "" -f /tmp/tkey || true
          PUB=$(cat /tmp/tkey.pub)
          docker run --rm -e PUBLIC_KEY="$PUB" $IMAGE bash -c '
            set -x
            echo "=== /run/sshd exists? ==="
            ls -ld /run/sshd 2>&1 || echo "NO /run/sshd"
            echo "=== authorized_keys write ==="
            echo "$PUBLIC_KEY" > /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys
            echo "=== ssh-keygen -A ==="
            ssh-keygen -A; echo "keygen rc=$?"
            echo "=== direct sshd start (no swallow) ==="
            /usr/sbin/sshd
            echo "sshd rc=$?"
            echo "=== listening? ==="
            (command -v ss >/dev/null && ss -tlnp | grep -E ":22|sshd") ||               (command -v netstat >/dev/null && netstat -tlnp | grep :22) || echo "no ss/netstat"
            echo "=== sshd_config root/login relevant ==="
            grep -iE "PermitRootLogin|AuthorizedKeysFile|^Port" /etc/ssh/sshd_config
          '
