name: SSHd Diagnosis (reproduce training sshd failure)
on:
  workflow_dispatch:

env:
  IMAGE: hrm3478938/pcbgenius-training:latest

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Reproduce sshd startup WITHOUT the entrypoint (use --entrypoint bash)
        run: |
          set -x
          docker pull $IMAGE
          ssh-keygen -q -t ed25519 -N "" -f /tmp/tkey || true
          PUB=$(cat /tmp/tkey.pub)
          # --entrypoint bash bypasses ssh_entrypoint.sh so we run ONLY the sshd steps
          docker run --rm --entrypoint bash -e PUBLIC_KEY="$PUB" $IMAGE -c '
            set -x
            echo "=== /run/sshd exists? ==="
            ls -ld /run/sshd 2>&1 || echo "NO /run/sshd"
            mkdir -p /root/.ssh && chmod 700 /root/.ssh
            echo "$PUBLIC_KEY" > /root/.ssh/authorized_keys && chmod 600 /root/.ssh/authorized_keys || true
            echo "=== ssh-keygen -A ==="
            ssh-keygen -A; echo "keygen rc=$?"
            echo "=== which sshd ==="
            which sshd; ls -la /usr/sbin/sshd
            echo "=== direct sshd start (no swallow) ==="
            /usr/sbin/sshd -e
            echo "sshd rc=$?"
            echo "=== sshd_config relevant ==="
            grep -iE "PermitRootLogin|AuthorizedKeysFile|^Port" /etc/ssh/sshd_config || echo "no config grep"
            echo "=== /run/sshd after start ==="
            ls -ld /run/sshd 2>&1
            echo "=== DONE ==="
          '
