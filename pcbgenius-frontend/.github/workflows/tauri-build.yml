name: Tauri Build (Windows)

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build-tauri:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Rust stable toolchain with native WebView2 (preinstalled on Windows).
      - name: Rust setup
        uses: dtolnay/rust-toolchain@stable

      # Cache Cargo registry + target dir to keep builds fast on repeat runs.
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: ./pcbgenius-frontend/src-tauri

      # Node 20 for the React+Vite frontend.
      - name: Node setup
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ./pcbgenius-frontend/package-lock.json

      # Tauri CLI is pulled at build time so the lockfile pin stays fresh.
      - name: Install frontend deps
        working-directory: ./pcbgenius-frontend
        run: npm ci

      # NOTE: production static assets also run `npm run build` internally
      # via beforeBuildCommand in tauri.conf.json. Build them explicitly so
      # a broken frontend fails this job before the slow Rust compile starts.
      - name: Build frontend
        working-directory: ./pcbgenius-frontend
        run: npm run build

      # Package the Windows desktop app (msi + nsis installers).
      - name: Tauri build
        working-directory: ./pcbgenius-frontend
        run: |
          npm install --save-dev @tauri-apps/cli@^2
          npx tauri build

      # Upload installers as a build artifact for manual download / release.
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: pcbgenius-windows
          if-no-files-found: error
          path: |
            ./pcbgenius-frontend/src-tauri/target/release/bundle/msi/*.msi
            ./pcbgenius-frontend/src-tauri/target/release/bundle/nsis/*.exe
